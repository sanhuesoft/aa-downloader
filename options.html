<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Anna's Archive Downloader — Ajustes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 32px;
      min-width: 480px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    #domain-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    #domain-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      font-family: monospace;
    }

    #domain-list li .remove-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
    }

    #domain-list li .remove-btn:hover { color: #e05252; }

    .add-row {
      display: flex;
      gap: 8px;
    }

    #new-domain {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 9px 12px;
      font-size: 14px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    #new-domain:focus { border-color: #007bff; }
    #new-domain::placeholder { color: #555; }

    button.primary {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.primary:hover { background: #0056b3; }

    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #4caf50;
      min-height: 20px;
      transition: opacity 0.3s;
    }

    .status.error { color: #e05252; }

    .reset-row {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .reset-row span {
      font-size: 12px;
      color: #666;
    }

    button.secondary {
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button.secondary:hover { background: #333; color: #e0e0e0; }
  </style>
</head>
<body>
  <h1>📖 Anna's Archive Downloader</h1>
  <p class="subtitle">Dominios en los que se activa la extensión</p>

  <p class="section-title">Dominios activos</p>
  <ul id="domain-list"></ul>

  <div class="add-row">
    <input id="new-domain" type="text" placeholder="ej. annas-archive.xyz" autocomplete="off" spellcheck="false" />
    <button class="primary" id="add-btn">Añadir</button>
  </div>

  <div class="status" id="status"></div>

  <div class="reset-row">
    <span>Restaurar lista original de dominios</span>
    <button class="secondary" id="reset-btn">Restaurar lista por defecto</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
